name: AI EMA20 Pullback ADX25 4H Independent Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-independent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated AI research branch
        uses: actions/checkout@v4
        with:
          ref: ai-trend-pullback-research

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate research code
        run: |
          python -m py_compile \
            research/download_okx_candles.py \
            research/download_okx_funding_archive.py \
            research/indicator_features.py \
            research/backtest_frozen_indicators.py \
            research/test_ai_ema20_adx25_4h.py

      - name: Download closed 4H candles and historical funding, then run frozen independent test
        run: python research/test_ai_ema20_adx25_4h.py

      - name: Upload reproducibility report and trade log
        uses: actions/upload-artifact@v4
        with:
          name: ai-ema20-pullback-adx25-4h-independent-2024-2025
          path: ai-trend-pullback-results/
          if-no-files-found: error
          retention-days: 90
