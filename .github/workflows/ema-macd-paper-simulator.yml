name: EMA MACD Paper Simulator

on:
  schedule:
    - cron: "3 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ema-macd-paper-simulator
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check simulator syntax
        run: python -m py_compile research/ema_macd_paper_simulator.py

      - name: Run virtual-only simulator
        run: python research/ema_macd_paper_simulator.py

      - name: Save virtual account state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add research/paper_simulator_state.json research/paper_simulator_report.json
          git diff --cached --quiet || git commit -m "Update EMA MACD paper simulation"
          git push origin HEAD:main

      - name: Upload readable simulation report
        uses: actions/upload-artifact@v4
        with:
          name: ema-macd-paper-simulation-report
          path: research/paper_simulator_report.json
          if-no-files-found: error
          retention-days: 30
