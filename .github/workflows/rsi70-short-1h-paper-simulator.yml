name: RSI70 SHORT 1H Paper Simulator

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsi70-short-1h-paper-simulator
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check simulator syntax
        run: python -m py_compile research/rsi70_short_1h_paper_simulator.py

      - name: Run RSI70 strategies in virtual-only mode
        run: python research/rsi70_short_1h_paper_simulator.py

      - name: Save separate virtual accounts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rsi70_short_1h_paper_state.json research/rsi70_short_1h_paper_report.json
          git diff --cached --quiet || git commit -m "Update RSI70 1H paper accounts"
          git push origin HEAD:main

      - name: Upload paper simulation report
        uses: actions/upload-artifact@v4
        with:
          name: rsi70-short-1h-paper-simulation-report
          path: research/rsi70_short_1h_paper_report.json
          if-no-files-found: error
          retention-days: 30
