name: Professional Strategies Paper Simulator
on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"
permissions:
  contents: write
concurrency:
  group: professional-strategies-paper
  cancel-in-progress: false
jobs:
  paper-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated paper research branch
        uses: actions/checkout@v4
        with:
          ref: professional-strategies-paper
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate simulator
        run: python -m py_compile research/professional_strategies_paper_simulator.py
      - name: Run virtual-only simulator
        run: python research/professional_strategies_paper_simulator.py
      - name: Persist paper accounts on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/professional_paper_state.json research/professional_paper_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update professional strategies paper accounts"
            git push origin HEAD:professional-strategies-paper
          fi
      - name: Upload report and account state
        uses: actions/upload-artifact@v4
        with:
          name: professional-strategies-paper-report
          path: |
            research/professional_paper_report.json
            research/professional_paper_state.json
            research/PROFESSIONAL_STRATEGIES_PAPER_SPEC.md
          if-no-files-found: error
          retention-days: 90
