name: OKX Microstructure Shadow Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  group: okx-microstructure-shadow
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: okx-microstructure-shadow
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install WebSocket client
        run: python -m pip install --disable-pip-version-check "websockets>=12,<16"
      - name: Compile observer
        run: python -m py_compile research/okx_microstructure_shadow.py
      - name: Collect 75-second market microstructure sample
        run: python research/okx_microstructure_shadow.py
      - name: Commit observation rows to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/okx_microstructure_observations.jsonl
          if git diff --cached --quiet; then
            echo "No observation changes to commit."
          else
            git commit -m "Record OKX microstructure shadow observations"
            git push
          fi
