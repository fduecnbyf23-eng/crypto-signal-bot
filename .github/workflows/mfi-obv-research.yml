name: MFI and OBV Indicator Research

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical period"
        required: true
        default: "365"
        type: choice
        options:
          - "90"
          - "180"
          - "365"

permissions:
  contents: read

jobs:
  mfi-obv-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: live-trading
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate research script
        run: python -m py_compile research/backtest_mfi_obv.py
      - name: Download closed OKX SPOT and SWAP candles
        run: python research/download_okx_candles.py --days "\${{ inputs.days }}" --out research-data
      - name: Download historical OKX Futures funding
        run: python research/download_okx_funding_archive.py --days "\${{ inputs.days }}" --out research-data
      - name: Run isolated MFI and OBV tests
        run: python research/backtest_mfi_obv.py --data research-data --out mfi-obv-results
      - name: Upload MFI and OBV research results
        uses: actions/upload-artifact@v4
        with:
          name: mfi-obv-research-\${{ inputs.days }}-days
          path: |
            mfi-obv-results/
            research-data/manifest.json
            research-data/funding_manifest.json
          if-no-files-found: error
          retention-days: 30
