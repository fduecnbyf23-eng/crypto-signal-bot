name: Strategy Research Data

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical period (30–365 days)"
        required: true
        default: "90"
        type: choice
        options:
          - "30"
          - "60"
          - "90"
          - "180"
          - "365"

permissions:
  contents: read

jobs:
  download-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: live-trading

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check research scripts
        run: python -m py_compile research/download_okx_candles.py research/download_okx_funding.py research/backtest_strategy.py research/short_strategy_experiments.py

      - name: Download closed OKX candles
        run: python research/download_okx_candles.py --days "${{ inputs.days }}" --out research-data

      - name: Download historical OKX funding rates
        run: python research/download_okx_funding.py --days "${{ inputs.days }}" --out research-data

      - name: Run historical strategy replay
        run: python research/backtest_strategy.py --data research-data --out research-results

      - name: Run chronological SHORT-only experiments
        run: python research/short_strategy_experiments.py --data research-data --out research-results

      - name: Upload research data and backtest results
        uses: actions/upload-artifact@v4
        with:
          name: okx-strategy-research-${{ inputs.days }}-days
          path: |
            research-data/
            research-results/
          if-no-files-found: error
          retention-days: 14
