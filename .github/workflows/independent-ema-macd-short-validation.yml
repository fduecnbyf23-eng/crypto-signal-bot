name: Independent EMA MACD SHORT 4H Validation 2024-2025

on:
  push:
    branches:
      - indicator-research-preparation
    paths:
      - ".github/workflows/independent-ema-macd-short-validation.yml"
      - "research/download_ema_macd_warmup.py"
      - "research/download_okx_candles_window.py"
      - "research/download_okx_candles.py"
      - "research/backtest_independent_ema_macd_short.py"
      - "research/backtest_frozen_indicators.py"
      - "research/indicator_features.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: indicator-research-preparation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download independently audited 2024-2025 hourly archive
        uses: actions/download-artifact@v4
        with:
          name: okx-independent-1h-and-funding-2024-2025
          run-id: 45860787155
          github-token: ${{ github.token }}
          path: independent-1h-data

      - name: Compile frozen research tools
        run: |
          python -m py_compile research/download_okx_candles.py research/download_okx_candles_window.py research/download_ema_macd_warmup.py research/indicator_features.py research/backtest_frozen_indicators.py research/backtest_independent_ema_macd_short.py

      - name: Download exact 40-day pre-test EMA200 warm-up
        run: python research/download_ema_macd_warmup.py

      - name: Run frozen EMA MACD SHORT 4H independent replay
        run: |
          python research/backtest_independent_ema_macd_short.py --warmup-dir ema-macd-warmup --test-dir independent-1h-data --output-dir independent-ema-macd-short-2024-2025

      - name: Validate report, boundaries, and funding
        run: |
          python - <<'PY'
          import csv, json, os
          base = "independent-ema-macd-short-2024-2025"
          for name in ("summary.csv", "trades.csv", "monthly_summary.csv", "metadata.json"):
              if not os.path.exists(os.path.join(base, name)):
                  raise SystemExit("Missing output: " + name)
          with open(os.path.join(base, "summary.csv"), newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          symbols = {r["symbol"]: r for r in rows if r["aggregation_level"] == "SYMBOL"}
          aggregate = [r for r in rows if r["aggregation_level"] == "ALL_SYMBOLS"]
          with open(os.path.join(base, "metadata.json"), encoding="utf-8") as f:
              meta = json.load(f)
          if set(symbols) != {"BTC", "ETH", "SOL", "BNB", "XRP"} or len(aggregate) != 1:
              raise SystemExit("Unexpected independent summary groups")
          if not meta["all_symbols"]["data_valid"] or not meta["all_symbols"]["funding_valid"]:
              raise SystemExit("Independent data/funding audit failed")
          with open(os.path.join(base, "trades.csv"), newline="", encoding="utf-8") as f:
              trades = list(csv.DictReader(f))
          for trade in trades:
              if trade["entry_time_utc"] and trade["entry_time_utc"] < "2024-11-26T04:00:00":
                  raise SystemExit("Trade entry occurred before the frozen test window")
          if any(r["funding_valid"] != "True" or int(r["invalid_funding_trades"]) != 0 for r in rows):
              raise SystemExit("Invalid funding reported in summary")
          print("INDEPENDENT_EMA_MACD_SHORT_REPORT_OK")
          for symbol in sorted(symbols):
              print(symbol, symbols[symbol])
          print("AGGREGATE", aggregate[0])
          PY

      - name: Upload independent EMA MACD SHORT results
        uses: actions/upload-artifact@v4
        with:
          name: independent-ema-macd-short-4h-2024-2025
          path: independent-ema-macd-short-2024-2025/
          retention-days: 30
