name: OKX Open Interest and Taker Flow Research

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical period (OKX 4H derivatives statistics support up to about 240 days)"
        required: true
        default: "240"
        type: choice
        options:
          - "30"
          - "60"
          - "90"
          - "180"
          - "240"

permissions:
  contents: read

jobs:
  derivatives-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: live-trading

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate research scripts
        run: |
          python -m py_compile research/backtest_strategy.py research/backtest_derivatives_filters.py research/download_okx_candles.py research/download_okx_funding_archive.py research/download_okx_derivatives_metrics.py

      - name: Download closed OKX candles
        run: python research/download_okx_candles.py --days "${{ inputs.days }}" --out research-data

      - name: Download historical OKX Futures funding
        run: python research/download_okx_funding_archive.py --days "${{ inputs.days }}" --out research-data

      - name: Download OKX 4H derivatives statistics
        run: python research/download_okx_derivatives_metrics.py --days "${{ inputs.days }}" --out research-derivatives

      - name: Backtest Open Interest and taker-flow filters
        run: python research/backtest_derivatives_filters.py --data research-data --metrics research-derivatives --out derivatives-results

      - name: Upload derivatives research results and data manifests
        uses: actions/upload-artifact@v4
        with:
          name: okx-oi-taker-flow-research-${{ inputs.days }}-days
          path: |
            derivatives-results/
            research-data/manifest.json
            research-data/funding_manifest.json
            research-derivatives/derivatives_manifest.json
          if-no-files-found: error
          retention-days: 30
